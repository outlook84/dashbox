name: Docker

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      should_build: ${{ steps.matrix.outputs.should_build }}
    steps:
      - name: Select build targets
        id: matrix
        shell: bash
        run: |
          echo 'matrix={"target":["current"]}' >> "$GITHUB_OUTPUT"
          echo 'should_build=true' >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select workflow ref
        id: build_ref
        shell: bash
        run: |
          ref_name="${GITHUB_REF_NAME}"
          ref_type="${GITHUB_REF_TYPE}"
          ref_name="${ref_name//\//-}"
          echo "name=$ref_name" >> "$GITHUB_OUTPUT"
          echo "type=$ref_type" >> "$GITHUB_OUTPUT"

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          echo "name=${image,,}" >> "$GITHUB_OUTPUT"

      - name: Resolve package version
        id: package
        shell: bash
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ -z "$version" ]; then
            echo "Unable to resolve package version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        if: steps.build_ref.outputs.type == 'tag'
        shell: bash
        run: |
          expected_tag="v${{ steps.package.outputs.version }}"
          actual_tag="${{ steps.build_ref.outputs.name }}"
          if [ "$actual_tag" != "$expected_tag" ]; then
            echo "Release tag $actual_tag does not match pyproject.toml version $expected_tag" >&2
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.8"

      - name: Build Docker tags
        id: tags
        shell: bash
        run: |
          image="${{ steps.image.outputs.name }}"
          package_version="${{ steps.package.outputs.version }}"
          ref_name="${{ steps.build_ref.outputs.name }}"
          ref_type="${{ steps.build_ref.outputs.type }}"

          if [ "$ref_type" = "tag" ]; then
            tag_names=(
              "$ref_name"
              "v${package_version}"
              "latest"
            )
          elif [ "$ref_name" = "main" ]; then
            tag_names=(
              "main"
              "main-py-${package_version}"
            )
          else
            tag_names=(
              "$ref_name"
              "${ref_name}-py-${package_version}"
            )
          fi

          tags=()
          declare -A seen=()
          for tag_name in "${tag_names[@]}"; do
            if [ -n "${seen["$tag_name"]:-}" ]; then
              continue
            fi
            seen["$tag_name"]=1
            tags+=("${image}:${tag_name}")
          done

          printf "tags<<EOF\n" >> "$GITHUB_OUTPUT"
          printf "%s\n" "${tags[@]}" >> "$GITHUB_OUTPUT"
          printf "EOF\n" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.13"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        run: pnpm run build

      - name: Check bundled assets
        run: pnpm run check:assets

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=docker-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.target }}
