name: Update yt-dlp release

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: ytdlp-release
  cancel-in-progress: false

jobs:
  update:
    name: Update yt-dlp and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.8"

      - name: Resolve current yt-dlp version
        id: current
        shell: bash
        run: |
          version="$(python -c 'import tomllib; data = tomllib.load(open("uv.lock", "rb")); print(next(package["version"] for package in data["package"] if package["name"] == "yt-dlp"))')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Update yt-dlp lock
        run: uv lock --upgrade-package yt-dlp --prerelease allow

      - name: Resolve updated yt-dlp version
        id: updated
        shell: bash
        run: |
          version="$(python -c 'import tomllib; data = tomllib.load(open("uv.lock", "rb")); print(next(package["version"] for package in data["package"] if package["name"] == "yt-dlp"))')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Stop when yt-dlp is current
        if: steps.current.outputs.version == steps.updated.outputs.version
        run: echo "yt-dlp is already current at ${{ steps.current.outputs.version }}"

      - name: Prepare release version
        id: release
        if: steps.current.outputs.version != steps.updated.outputs.version
        run: uv run --with packaging python scripts/prepare_ytdlp_release.py

      - name: Refresh lock metadata
        if: steps.current.outputs.version != steps.updated.outputs.version
        run: uv lock --upgrade-package yt-dlp --prerelease allow

      - name: Verify expected files changed
        if: steps.current.outputs.version != steps.updated.outputs.version
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          unexpected="$(printf "%s\n" "$changed" | grep -Ev '^(pyproject.toml|uv.lock)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected changed files:" >&2
            printf "%s\n" "$unexpected" >&2
            exit 1
          fi

      - name: Run focused tests
        if: steps.current.outputs.version != steps.updated.outputs.version
        run: uv run pytest tests/media/test_ytdlp_client.py

      - name: Commit and tag release
        if: steps.current.outputs.version != steps.updated.outputs.version
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "chore: update yt-dlp to ${{ steps.release.outputs.ytdlp_version }}"
          git tag "${{ steps.release.outputs.tag }}"
          git push origin HEAD:main "${{ steps.release.outputs.tag }}"

      - name: Trigger PyPI release
        if: steps.current.outputs.version != steps.updated.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pypi.yml --ref "${{ steps.release.outputs.tag }}"
